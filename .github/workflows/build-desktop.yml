name: Build desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            bundle: nsis
            package: src-tauri/target/release/bundle/nsis/*.exe
          - runner: ubuntu-24.04
            bundle: deb
            package: src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev
      - run: rustup update stable
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@v6
        with:
          name: filestorage-${{ matrix.bundle }}
          path: ${{ matrix.package }}
          if-no-files-found: error
