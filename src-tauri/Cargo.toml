[package]
name = "filestorage"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[lib]
name = "filestorage"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
anyhow = "1"
blake3 = "1"
cap-std = "4.0"
cap-fs-ext = "4.0"
getrandom = "0.4"
hex = "0.4"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
iroh-tickets = "1"
keyring = "4.2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
serde_json = "1"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
